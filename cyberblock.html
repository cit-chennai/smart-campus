<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Security</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

body{
  margin:0;
  font-family:'Share Tech Mono', monospace;
  background:#020403;
  color:#00ff9c;
  text-align:center;
}

/* Header */
header{
  background:linear-gradient(90deg,#003b2f,#00695c,#00c853);
  padding:25px;
  font-size:30px;
  font-weight:600;
  box-shadow:0 5px 20px rgba(0,255,150,0.4);
}

/* Card */
.card{
  background:#041a16;
  margin:60px auto;
  padding:35px;
  width:90%;
  max-width:550px;

  border-radius:15px;
  border:2px solid #00ff9c;

  box-shadow:0 0 20px rgba(0,255,150,0.4);
  transition:0.35s;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 0 35px rgba(0,255,150,0.8);
}

/* Select */
select{
  width:90%;
  padding:12px;
  margin:12px;

  border-radius:8px;
  border:2px solid #00ff9c;

  background:#020403;
  color:#00ff9c;
  font-size:15px;
}

select:focus{
  outline:none;
  box-shadow:0 0 10px #00ff9c;
}

/* Button */
button{
  width:90%;
  padding:13px;
  margin-top:15px;

  border:none;
  border-radius:8px;

  font-size:17px;
  font-weight:600;

  background:#00ff9c;
  color:black;

  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px #00ff9c;
}

/* Icon */
.icon{
  font-size:40px;
  margin-bottom:10px;
}

</style>
</head>
<body>
<header>CYBER SECURITY</header>
<div class="card">
<h2>You are at: CSE Block – Cyber Security</h2>
  <p>
    Cyber Security focuses on ethical hacking, network security, digital forensics, and 
    secure information system design to protect digital infrastructures.
  </p>
<div class="section">
<h3>LABS</h3>
<p>Ethical Hacking Lab<br>Digital Forensics Lab<br>Network Security Lab</p>
</div>
<a href="cseblock.html"><button>Back to CSE Block</button></a>
</div>
</body>
</html>
