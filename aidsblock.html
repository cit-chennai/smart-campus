<!DOCTYPE html>
<html>
<style>

@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap');

body{
  margin:0;
  font-family:'Source Code Pro', monospace;
  background:#0d1117;
  color:#e6edf3;
  text-align:center;
}

/* Header */
header{
  background:#161b22;
  padding:25px;
  font-size:30px;
  font-weight:600;
  border-bottom:2px solid #30363d;
}

/* Card */
.card{
  background:#161b22;
  margin:60px auto;
  padding:35px;
  width:90%;
  max-width:550px;
  border-radius:15px;
  border:1px solid #30363d;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 15px 35px rgba(0,0,0,0.8);
}

/* Inputs */
select{
  width:90%;
  padding:12px;
  margin:12px;
  border-radius:8px;
  border:1px solid #30363d;
  background:#0d1117;
  color:white;
  font-size:15px;
}

select:focus{
  outline:none;
  border-color:#58a6ff;
  box-shadow:0 0 10px rgba(88,166,255,0.6);
}

/* Button */
button{
  width:90%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;

  background:#238636;
  color:white;

  transition:0.3s;
}

button:hover{
  background:#2ea043;
  transform:scale(1.05);
}

/* Code style text */
.code{
  color:#58a6ff;
  font-size:18px;
  margin-bottom:10px;
}

</style>
<body>
<header>AIDS BLOCK</header>
<div class="card">
<h2>You are at: AIDS BLOCK</h2>
  <p>
    Artificial Intelligence and Data Science focuses on data analytics, predictive modeling, 
    big‑data processing, and intelligent decision‑making systems used in modern industries.
  </p>
  <div class="section">
<h3>LABS</h3>
<p>Data Analytics Lab<br>Big Data Lab<br>AI Research Lab</p>
  </div>
<a href="index.html"><button>Back to Main</button></a>
</div>
</body>
</html>
