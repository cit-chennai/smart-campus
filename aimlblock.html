<!DOCTYPE html>
<html>
<style>

/* Google font for modern look */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

*{
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  text-align:center;
  min-height:100vh;

  background: linear-gradient(-45deg,#00c6ff,#0072ff,#6a11cb,#2575fc);
  background-size:400% 400%;
  animation: bgMove 12s ease infinite;
  color:#333;
}

/* Animated gradient background */
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

header{
  padding:25px;
  font-size:32px;
  font-weight:600;
  color:white;
  letter-spacing:1px;
  text-shadow:0 3px 10px rgba(0,0,0,0.3);
}

/* Glass card */
.card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  margin:60px auto;
  padding:40px;
  width:95%;
  max-width:550px;

  border-radius:25px;
  border:1px solid rgba(255,255,255,0.3);

  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  transition:all .35s ease;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 25px 50px rgba(0,0,0,0.35);
}

/* Inputs */
select{
  width:90%;
  padding:14px;
  margin:12px;
  font-size:16px;

  border:none;
  border-radius:12px;
  outline:none;

  background:white;
  transition:all .3s ease;
}

select:focus{
  transform:scale(1.02);
  box-shadow:0 0 12px rgba(0,114,255,0.4);
}

/* Button style */
button{
  width:90%;
  padding:14px;
  margin-top:15px;

  font-size:17px;
  font-weight:600;

  border:none;
  border-radius:14px;

  color:white;
  cursor:pointer;

  background:linear-gradient(45deg,#ff7b00,#ff0058);
  transition:all .3s ease;
}

/* Hover animation */
button:hover{
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* Click effect */
button:active{
  transform:scale(.95);
}

/* Optional icon style */
.icon{
  font-size:40px;
  margin-bottom:10px;
}

</style>
<body>
<header>AIML SPECIALIZATION</header>
<div class="card">
<h2>You are at: CSE Block – AIML</h2>
  <p>
    Artificial Intelligence and Machine Learning specializes in deep learning, 
    neural networks, intelligent automation, and smart system development.
  </p>
  <div class="section">
<h3>LABS</h3>
<p>Machine Learning Lab<br>Deep Learning Lab<br>AI Innovation Lab</p>
  </div>
<a href="cseblock.html"><button>Back to CSE Block</button></a>
</div>
</body>
</html>
