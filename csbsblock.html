<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSBS Block</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}

/* Header */
header{
  background:linear-gradient(90deg,#4f46e5,#6366f1,#8b5cf6);
  padding:25px;
  font-size:30px;
  font-weight:600;
  box-shadow:0 5px 20px rgba(99,102,241,0.5);
}

/* Card */
.card{
  background:#1e293b;
  margin:60px auto;
  padding:35px;
  width:90%;
  max-width:550px;

  border-radius:18px;
  border:2px solid #6366f1;

  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  transition:0.35s;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 0 25px rgba(99,102,241,0.7);
}

/* Select */
select{
  width:90%;
  padding:12px;
  margin:12px;

  border-radius:10px;
  border:2px solid #6366f1;

  background:#0f172a;
  color:white;
  font-size:15px;
}

select:focus{
  outline:none;
  box-shadow:0 0 10px #8b5cf6;
}

/* Button */
button{
  width:90%;
  padding:13px;
  margin-top:15px;

  border:none;
  border-radius:10px;

  font-size:17px;
  font-weight:600;

  background:linear-gradient(45deg,#4f46e5,#8b5cf6);
  color:white;

  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px #8b5cf6;
}

/* Icon */
.icon{
  font-size:40px;
  margin-bottom:10px;
}

</style>
</head>
<body>
<header>CSBS BLOCK</header>
<div class="card">
<h2>You are at: CSBS BLOCK</h2>
  <p>
    Computer Science and Business Systems integrates computing technologies with business analytics, 
    digital enterprise solutions, and management information systems.
  </p>
<div class="section">
<h3>LABS</h3>
<p>Business Analytics Lab<br>Software Engineering Lab<br>Innovation Lab</p>
</div>
<a href="index.html"><button>Back to Main</button></a>
</div>
</body>
</html>
