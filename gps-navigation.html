<!DOCTYPE html>
<html>
<style>

/* Google font for modern look */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

*{
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  text-align:center;
  min-height:100vh;

  background: linear-gradient(-45deg,#00c6ff,#0072ff,#6a11cb,#2575fc);
  background-size:400% 400%;
  animation: bgMove 12s ease infinite;
  color:#333;
}

/* Animated gradient background */
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

header{
  padding:25px;
  font-size:32px;
  font-weight:600;
  color:white;
  letter-spacing:1px;
  text-shadow:0 3px 10px rgba(0,0,0,0.3);
}

/* Glass card */
.card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  margin:60px auto;
  padding:40px;
  width:95%;
  max-width:550px;

  border-radius:25px;
  border:1px solid rgba(255,255,255,0.3);

  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  transition:all .35s ease;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 25px 50px rgba(0,0,0,0.35);
}

/* Inputs */
select{
  width:90%;
  padding:14px;
  margin:12px;
  font-size:16px;

  border:none;
  border-radius:12px;
  outline:none;

  background:white;
  transition:all .3s ease;
}

select:focus{
  transform:scale(1.02);
  box-shadow:0 0 12px rgba(0,114,255,0.4);
}

/* Button style */
button{
  width:90%;
  padding:14px;
  margin-top:15px;

  font-size:17px;
  font-weight:600;

  border:none;
  border-radius:14px;

  color:white;
  cursor:pointer;

  background:linear-gradient(45deg,#ff7b00,#ff0058);
  transition:all .3s ease;
}

/* Hover animation */
button:hover{
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* Click effect */
button:active{
  transform:scale(.95);
}

/* Optional icon style */
.icon{
  font-size:40px;
  margin-bottom:10px;
}

</style>
<body>

<header>Campus GPS Navigation</header>

<div class="card">

<h3>Select Destination</h3>

<select id="destination">
<option value="">-- Choose Block --</option>

<option value="12.971081,80.042877">EEE</option>
<option value="13.0810,80.2710">CSE</option>
<option value="13.0820,80.2720">ECE</option>
<option value="13.0830,80.2730">AIDS</option>
<option value="13.0840,80.2740">IT</option>
<option value="13.0850,80.2750">CSBS</option>
<option value="13.0860,80.2760">Civil</option>
<option value="13.0870,80.2770">Mechanical</option>
<option value="13.0880,80.2780">Mechatronics</option>
<option value="13.0890,80.2790">BME</option>
<option value="13.0900,80.2800">Library</option>
<option value="12.971601475631168, 80.04308606198757">Main Building</option>

</select>

<button onclick="openMaps()">Get Directions</button>

</div>

<script>

// Auto-select from block page
const params = new URLSearchParams(window.location.search);
const dest = params.get("dest");

if(dest){
  const dropdown = document.getElementById("destination");
  for(let i=0; i<dropdown.options.length; i++){
    if(dropdown.options[i].text === dest){
      dropdown.selectedIndex = i;
    }
  }
}

function openMaps(){
  const coords = document.getElementById("destination").value;
  if(coords){
    window.open(
      "https://www.google.com/maps/dir/?api=1&destination=" + coords,
      "_blank"
    );
  } else {
    alert("Please select a destination");
  }
}

</script>

</body>
</html>
